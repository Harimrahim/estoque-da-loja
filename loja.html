<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja • Estoque</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="logo.png" alt=""><h1>Painel da Loja<br><small id="dt" style="color:#fffc"></small></h1><a id="nav" class="hide" href="comprador.html">Comprador</a><button id="out">Sair</button></header>
<main>
<div id="seg" class="card hide"><b>Hoje é segunda!</b> Este fechamento também registra o total da semana para o giro.</div>
<div id="info" class="card"></div><div id="lista"></div>
<button class="b" id="salvar">Salvar fechamento do dia</button>
</main>
<div id="pop" class="modal hide"><div><h2 style="margin-top:0">⚠️ Validade próxima</h2><div id="pl"></div><p><b>Validade próxima, é recomendável a criação de uma promoção com esse item.</b></p><button class="b" onclick="this.closest('.modal').classList.add('hide')">Entendi</button></div></div>
<script type="module">
import {auth,db,guard,sair,hoje,diasAte,esc,dBR,itens,$,doc,getDoc,writeBatch,serverTimestamp} from "./comum.js";
const CAT={adicional:'Adicionais',base:'Açaí e bases',embalagem:'Embalagens (estimativa)',outro:'Outros'};
let L=[],F={},eu;
$('out').onclick=sair;$('dt').textContent=dBR(hoje());
if(new Date().getDay()==1)$('seg').classList.remove('hide');
guard(['loja','dono'],async(u,p)=>{eu=u;if(p=='dono')$('nav').classList.remove('hide');
 L=await itens();const f=await getDoc(doc(db,'fechamentos',hoje()));F=f.exists()?f.data():{};
 $('info').innerHTML=f.exists()?'✅ O fechamento de hoje já foi feito. Você pode corrigir e salvar de novo.':'Pese os itens, estime as embalagens e salve. Compras do dia já entram pelo painel do comprador.';
 if(L.length)render();else $('lista').innerHTML='<div class="card">Nenhum item cadastrado ainda. O comprador cadastra os itens no painel dele.</div>';
 alerta()});
function render(){let h='';
 for(const c in CAT){const g=L.filter(i=>(CAT[i.categoria]?i.categoria:'outro')==c);if(!g.length)continue;h+=`<h2>${CAT[c]}</h2>`;
  for(const i of g)h+=`<div class="card"><b>${esc(i.nome)}</b> <small>(último: ${i.estoque} ${i.unidade})</small><div class="row"><input id="q_${i.id}" type="number" inputmode="decimal" min="0" step="any" placeholder="Quanto tem? (${i.unidade})" value="${F.contagens?.[i.id]??''}">${i.perecivel?`<input id="v_${i.id}" type="date" value="${i.validade||''}">`:''}</div>${i.perecivel?'<small>Validade do lote mais antigo que está na loja.</small>':''}</div>`}
 $('lista').innerHTML=h}
function alerta(){const v=L.filter(i=>i.validade&&i.estoque>0&&diasAte(i.validade)<=3);if(!v.length)return;
 $('pl').innerHTML=v.map(i=>{const d=diasAte(i.validade);return `<p><b>${esc(i.nome)}</b> — ${d<0?'vencido':d==0?'vence hoje':'vence em '+d+' dia(s)'} (${dBR(i.validade)})</p>`}).join('');
 $('pop').classList.remove('hide')}
$('salvar').onclick=async()=>{
 const h=hoje(),b=writeBatch(db),c={},vs={},falta=[];
 for(const i of L){const q=$('q_'+i.id).value;if(q==='')continue;const n=+q;c[i.id]=n;
  const v=i.perecivel?$('v_'+i.id).value:'';if(v)vs[i.id]=v;else if(i.perecivel&&n>0)falta.push(i.nome);
  let m=i.consumoMedio||0;if(i.ultimoFechamento!=h&&i.estoque>=n){const u=i.estoque-n;m=m>0?.7*m+.3*u:u}
  b.update(doc(db,'itens',i.id),{estoque:n,validade:v,consumoMedio:m,ultimoFechamento:h,atualizadoEm:serverTimestamp()})}
 if(!Object.keys(c).length)return alert('Preencha pelo menos um item.');
 if(falta.length&&!confirm('Falta a validade de: '+falta.join(', ')+'. Salvar assim mesmo?'))return;
 b.set(doc(db,'fechamentos',h),{data:h,contagens:{...(F.contagens||{}),...c},validades:{...(F.validades||{}),...vs},por:eu.email},{merge:true});
 if(new Date().getDay()==1){const t={};L.forEach(i=>t[i.id]=c[i.id]??i.estoque);b.set(doc(db,'giro',h),{data:h,totais:t,por:eu.email})}
 try{await b.commit();alert('Fechamento salvo ✔');location.reload()}catch(e){alert('Não salvou: '+e.message)}};
</script></body></html>
