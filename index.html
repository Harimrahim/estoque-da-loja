<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sedex do Açaí • Estoque</title><link rel="stylesheet" href="style.css"></head>
<body><main style="text-align:center;padding-top:36px">
<img src="logo.png" alt="Sedex do Açaí" width="190" style="border-radius:26px">
<h2>Controle de estoque</h2>
<div class="card" style="text-align:left"><input id="e" type="email" placeholder="E-mail" autocomplete="username"><input id="s" type="password" placeholder="Senha" autocomplete="current-password"><button class="b" id="go">Entrar</button><p id="m"></p></div>
</main>
<script type="module">
import {auth,onAuthStateChanged,signInWithEmailAndPassword,papelDe,$} from "./comum.js";
const ir=async u=>{const p=await papelDe(u);if(!p){$('m').textContent='Usuário sem permissão. Peça ao dono para liberar o acesso.';return}location=p=='loja'?'loja.html':'comprador.html'};
onAuthStateChanged(auth,u=>u&&ir(u));
$('go').onclick=async()=>{$('m').textContent='Entrando...';try{await signInWithEmailAndPassword(auth,$('e').value.trim(),$('s').value)}catch(e){$('m').textContent='E-mail ou senha incorretos.'}};
</script></body></html>
